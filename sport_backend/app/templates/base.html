<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SportMap Admin{% endblock %}</title>
    <style>
        :root {
            --emerald-50: #ecfdf5;
            --emerald-100: #d1fae5;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --emerald-700: #047857;
            --emerald-800: #065f46;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --danger: #dc2626;
            --danger-dark: #b91c1c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            background: var(--gray-50);
            color: var(--gray-900);
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--emerald-700), var(--emerald-600));
            color: white;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(4,120,87,0.25);
            position: sticky;
            top: 0;
            z-index: 20;
        }
        header .brand { display: flex; align-items: center; gap: 10px; }
        header .brand-badge {
            width: 32px; height: 32px; border-radius: 9px;
            background: rgba(255,255,255,0.16);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
        header .brand-sub { font-size: 11px; color: var(--emerald-100); font-weight: 500; letter-spacing: .02em; }
        header nav { display: flex; align-items: center; gap: 4px; }
        header nav a {
            color: var(--emerald-100);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            transition: background .15s, color .15s;
        }
        header nav a:hover { color: white; background: rgba(255,255,255,0.12); }
        header nav a.active { color: white; background: rgba(255,255,255,0.22); }
        header nav a.logout {
            margin-left: 12px;
            color: #fecaca;
            border: 1.5px solid rgba(254,202,202,0.45);
            padding: 7px 14px;
        }
        header nav a.logout:hover { background: rgba(220,38,38,0.25); color: white; border-color: #fecaca; }

        main { max-width: 1040px; margin: 32px auto 64px; padding: 0 20px; }

        .top-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
        .top-row h2 { font-size: 22px; margin: 0 0 4px; font-weight: 800; color: var(--gray-900); letter-spacing: -0.01em; }
        .top-row .subtitle { font-size: 13.5px; color: var(--gray-500); margin: 0; }

        .card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04);
            margin-bottom: 20px;
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--gray-100); font-size: 14px; }
        th { color: var(--gray-500); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
        tbody tr { transition: background .12s; }
        tbody tr:hover { background: var(--gray-50); }
        tbody tr:last-child td { border-bottom: none; }
        img.thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--gray-100); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--emerald-600);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s, transform .1s, box-shadow .15s;
            box-shadow: 0 1px 2px rgba(5,150,105,0.15);
        }
        .btn:hover { background: var(--emerald-700); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(5,150,105,0.25); }
        .btn:active { transform: translateY(0); }
        .btn-danger { background: var(--danger); box-shadow: 0 1px 2px rgba(220,38,38,0.15); }
        .btn-danger:hover { background: var(--danger-dark); box-shadow: 0 4px 10px rgba(220,38,38,0.25); }
        .btn-secondary { background: white; color: var(--gray-700); border: 1px solid var(--gray-300); box-shadow: none; }
        .btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-400); transform: none; box-shadow: none; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .actions { display: flex; gap: 8px; }
        form.inline { display: inline; }

        /* Forms */
        label { display: block; font-size: 13px; color: var(--gray-700); margin: 0 0 6px; font-weight: 600; }
        label .req { color: var(--emerald-600); margin-left: 2px; }
        .hint { font-size: 12px; color: var(--gray-400); margin: 6px 0 0; }
        input[type=text], input[type=number], input[type=url], input[type=email], input[type=password], textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            color: var(--gray-900);
            transition: border-color .15s, box-shadow .15s;
        }
        input::placeholder, textarea::placeholder { color: var(--gray-400); }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--emerald-500);
            box-shadow: 0 0 0 3.5px rgba(16,185,129,0.15);
        }
        textarea { resize: vertical; min-height: 80px; }
        select { cursor: pointer; }

        input[type=file] {
            width: 100%;
            font-size: 13px;
            color: var(--gray-500);
            padding: 10px 12px;
            border: 1.5px dashed var(--gray-300);
            border-radius: 8px;
            background: var(--gray-50);
        }
        input[type=file]::file-selector-button {
            background: var(--emerald-600);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-right: 12px;
            cursor: pointer;
            transition: background .15s;
        }
        input[type=file]::file-selector-button:hover { background: var(--emerald-700); }

        .form-section { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--gray-100); }
        .form-section:last-of-type { border-bottom: none; margin-bottom: 8px; padding-bottom: 0; }
        .form-section-title { font-size: 14.5px; font-weight: 700; color: var(--gray-900); margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
        .form-section-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald-500); display: inline-block; }
        .form-section-desc { font-size: 12.5px; color: var(--gray-400); margin: 0 0 16px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
        .form-grid .full { grid-column: 1 / -1; }
        .form-field { margin: 0; }
        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            header { flex-wrap: wrap; gap: 10px; }
            header nav { flex-wrap: wrap; }
        }

        .image-preview-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .image-preview {
            width: 76px; height: 76px; border-radius: 10px;
            border: 1.5px solid var(--gray-200); background: var(--gray-50);
            object-fit: cover; flex-shrink: 0;
        }
        .image-preview-placeholder {
            width: 76px; height: 76px; border-radius: 10px;
            border: 1.5px dashed var(--gray-300); background: var(--gray-50);
            display: flex; align-items: center; justify-content: center;
            color: var(--gray-400); font-size: 22px; flex-shrink: 0;
        }

        .toggle-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: var(--gray-50); border: 1px solid var(--gray-200);
            border-radius: 10px; padding: 12px 14px; margin-top: 4px;
        }
        .toggle-row .toggle-label { font-size: 13.5px; font-weight: 600; color: var(--gray-700); }
        .toggle-row .toggle-hint { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute; cursor: pointer; inset: 0;
            background: var(--gray-300); border-radius: 999px; transition: background .15s;
        }
        .switch .slider::before {
            content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
            background: white; border-radius: 50%; transition: transform .15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .switch input:checked + .slider { background: var(--emerald-600); }
        .switch input:checked + .slider::before { transform: translateX(18px); }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
        .checkbox-row input { width: auto; accent-color: var(--emerald-600); }

        .input-prefix { position: relative; }
        .input-prefix span {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--gray-400); font-size: 14px; pointer-events: none;
        }
        .input-prefix input { padding-left: 32px; }

        .form-actions {
            display: flex; justify-content: flex-end; align-items: center; gap: 10px;
            margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--gray-100);
        }

        .flash { background: var(--emerald-50); color: var(--emerald-800); border: 1px solid var(--emerald-100); padding: 11px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; font-weight: 500; }
        .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; padding: 11px 16px; border-radius: 10px; margin-top: 16px; font-size: 13.5px; }
        .empty { color: var(--gray-500); text-align: center; padding: 40px 0; font-size: 14px; }

        /* Modal de confirmación flotante */
        .confirm-overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,0.55);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity .15s;
        }
        .confirm-overlay.open { opacity: 1; pointer-events: auto; }
        .confirm-box {
            background: white; border-radius: 16px; padding: 26px;
            width: 100%; max-width: 340px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            transform: translateY(10px) scale(.97); transition: transform .15s;
        }
        .confirm-overlay.open .confirm-box { transform: translateY(0) scale(1); }
        .confirm-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: #fef2f2; color: var(--danger);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin: 0 auto 14px;
        }
        .confirm-box h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--gray-900); }
        .confirm-box p { margin: 0 0 20px; font-size: 13.5px; color: var(--gray-500); }
        .confirm-actions { display: flex; gap: 10px; }
        .confirm-actions .btn { flex: 1; justify-content: center; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
            </div>
            <div>
                <h1>SportMap</h1>
                <div class="brand-sub">Panel de administración</div>
            </div>
        </div>
        <nav>
            <a href="/admin/orders" class="{{ 'active' if request.url.path.startswith('/admin/orders') else '' }}">Pedidos</a>
            <a href="/admin/products" class="{{ 'active' if request.url.path.startswith('/admin/products') else '' }}">Productos</a>
            <a href="/admin/places" class="{{ 'active' if request.url.path.startswith('/admin/places') else '' }}">Lugares</a>
            <a href="/admin/ads" class="{{ 'active' if request.url.path.startswith('/admin/ads') else '' }}">Anuncios</a>
            <a href="/admin/logout" class="logout" id="logout-link" onclick="return false;">Cerrar sesión</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="confirm-overlay" id="logout-overlay">
        <div class="confirm-box">
            <div class="confirm-icon">🚪</div>
            <h3>¿Cerrar sesión?</h3>
            <p>Tendrás que volver a iniciar sesión para acceder al panel.</p>
            <div class="confirm-actions">
                <button type="button" class="btn btn-secondary" id="logout-cancel">Cancelar</button>
                <a href="/admin/logout" class="btn btn-danger" id="logout-confirm">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="delete-overlay">
        <div class="confirm-box">
            <div class="confirm-icon">🗑️</div>
            <h3 id="delete-title">¿Eliminar este elemento?</h3>
            <p id="delete-message">Esta acción no se puede deshacer.</p>
            <div class="confirm-actions">
                <button type="button" class="btn btn-secondary" id="delete-cancel">Cancelar</button>
                <button type="button" class="btn btn-danger" id="delete-confirm">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var link = document.getElementById('logout-link');
            var overlay = document.getElementById('logout-overlay');
            var cancel = document.getElementById('logout-cancel');
            if (!link || !overlay) return;
            function open() { overlay.classList.add('open'); }
            function close() { overlay.classList.remove('open'); }
            link.addEventListener('click', open);
            cancel.addEventListener('click', close);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        })();

        (function () {
            var overlay = document.getElementById('delete-overlay');
            var messageEl = document.getElementById('delete-message');
            var cancelBtn = document.getElementById('delete-cancel');
            var confirmBtn = document.getElementById('delete-confirm');
            if (!overlay) return;
            var pendingForm = null;

            function close() {
                overlay.classList.remove('open');
                pendingForm = null;
            }

            document.querySelectorAll('form.delete-form').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    pendingForm = form;
                    messageEl.textContent = form.dataset.confirmMessage || '¿Eliminar este elemento? Esta acción no se puede deshacer.';
                    overlay.classList.add('open');
                });
            });

            confirmBtn.addEventListener('click', function () {
                if (pendingForm) {
                    var formToSubmit = pendingForm;
                    pendingForm = null;
                    overlay.classList.remove('open');
                    formToSubmit.submit();
                }
            });
            cancelBtn.addEventListener('click', close);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        })();
    </script>
</body>
</html>
