{% extends "base.html" %}
{% block title %}{{ "Editar" if product else "Nuevo" }} producto · SportMap Admin{% endblock %}
{% block content %}
<div class="top-row">
    <h2>{{ "Editar producto" if product else "Nuevo producto" }}</h2>
    <a class="btn btn-secondary" href="/admin/products">Volver</a>
</div>

<div class="card">
    <form method="post" enctype="multipart/form-data">
        <label>Nombre *</label>
        <input type="text" name="name" required value="{{ product.name if product else '' }}">

        <label>Descripción</label>
        <textarea name="description" rows="3">{{ product.description if product else '' }}</textarea>

        <label>Precio (S/.) *</label>
        <input type="number" step="0.01" min="0" name="price" required value="{{ product.price if product else '' }}">

        {% if product and product.image_url %}
        <img class="thumb" src="{{ product.image_url }}" alt="" style="width:80px;height:80px;margin-top:8px">
        {% endif %}
        <label>Subir imagen (reemplaza la URL de abajo si eliges un archivo)</label>
        <input type="file" name="image_file" accept="image/*">

        <label>URL de imagen</label>
        <input type="url" name="image_url" placeholder="https://images.unsplash.com/..." value="{{ product.image_url if product else '' }}">

        <label>Categoría</label>
        <select name="category">
            {% for cat in ["calzado", "balones", "hidratación", "accesorios", "ropa"] %}
            <option value="{{ cat }}" {% if product and product.category == cat %}selected{% endif %}>{{ cat|capitalize }}</option>
            {% endfor %}
        </select>

        <label>Tallas (separadas por coma)</label>
        <input type="text" name="sizes" placeholder="S,M,L,XL" value="{{ product.sizes if product else '' }}">

        <label>Stock</label>
        <input type="number" min="0" name="stock" value="{{ product.stock if product else 0 }}">

        <div class="checkbox-row">
            <input type="checkbox" id="is_on_sale" name="is_on_sale" {% if product and product.is_on_sale %}checked{% endif %}>
            <label style="margin:0" for="is_on_sale">En oferta</label>
        </div>

        <label>Descuento (%)</label>
        <input type="number" min="0" max="90" name="discount_percent" value="{{ product.discount_percent if product else 0 }}">

        <button class="btn" type="submit" style="margin-top:20px">{{ "Guardar cambios" if product else "Crear producto" }}</button>
    </form>
</div>
{% endblock %}
