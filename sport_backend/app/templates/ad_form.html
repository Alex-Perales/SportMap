{% extends "base.html" %}
{% block title %}{{ "Editar" if ad else "Nuevo" }} anuncio · SportMap Admin{% endblock %}
{% block content %}
<div class="top-row">
    <h2>{{ "Editar anuncio" if ad else "Nuevo anuncio" }}</h2>
    <a class="btn btn-secondary" href="/admin/ads">Volver</a>
</div>

<div class="card">
    <form method="post">
        <label>URL de imagen *</label>
        <input type="url" name="image_url" required placeholder="https://images.unsplash.com/..." value="{{ ad.image_url if ad else '' }}">

        <label>Etiqueta chica (esquina)</label>
        <input type="text" name="badge_text" placeholder="Nuevo, Beneficios Premium, SPORT..." value="{{ ad.badge_text if ad else '' }}">

        <label>Título *</label>
        <input type="text" name="title" required value="{{ ad.title if ad else '' }}">

        <label>Subtítulo</label>
        <input type="text" name="subtitle" value="{{ ad.subtitle if ad else '' }}">

        <label>Precio (opcional, S/.)</label>
        <input type="number" step="0.01" min="0" name="price" value="{{ ad.price if ad and ad.price is not none else '' }}">

        <label>Al tocarla, ¿a dónde lleva?</label>
        <select name="link_type">
            {% for lt, label in [("none", "A ningún lado"), ("premium", "Pantalla Premium"), ("product", "Un producto de la tienda"), ("external", "Enlace externo")] %}
            <option value="{{ lt }}" {% if ad and ad.link_type == lt %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>

        <label>Destino (id de producto o URL, según lo anterior)</label>
        <input type="text" name="link_target" value="{{ ad.link_target if ad else '' }}">

        <label>Orden (menor número aparece primero)</label>
        <input type="number" name="sort_order" value="{{ ad.sort_order if ad else 0 }}">

        <div class="checkbox-row">
            <input type="checkbox" id="is_active" name="is_active" {% if not ad or ad.is_active %}checked{% endif %}>
            <label style="margin:0" for="is_active">Activo (visible en la app)</label>
        </div>

        <button class="btn" type="submit" style="margin-top:20px">{{ "Guardar cambios" if ad else "Crear anuncio" }}</button>
    </form>
</div>
{% endblock %}
