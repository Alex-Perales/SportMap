<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · SportMap Admin</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #1e3a8a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .box {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { font-size: 18px; margin: 0 0 4px; }
        p.sub { color: #6b7280; font-size: 13px; margin: 0 0 20px; }
        label { display: block; font-size: 13px; color: #374151; margin: 12px 0 4px; font-weight: 600; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 18px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .error { background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-top: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Panel de administración</h1>
        <p class="sub">SportMap</p>
        <form method="post" action="/admin/login">
            <label>Correo</label>
            <input type="email" name="email" required value="{{ email or '' }}">
            <label>Contraseña</label>
            <input type="password" name="password" required>
            <button type="submit">Ingresar</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
</body>
</html>
